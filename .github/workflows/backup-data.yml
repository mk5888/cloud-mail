name: 💾 Backup Cloudflare data (D1 / KV / R2)

on:
  schedule:
    - cron: "30 17 * * *"   # 每天 UTC 17:30（台北时间 01:30）自动备份
  workflow_dispatch:

permissions:
  contents: write        # keepalive 空提交需要

jobs:
  backup:
    name: 📦 Export and upload backup
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: email                                # D1 数据库名称
      KV_NAMESPACE_ID: 8433e5042f274023bfd4495d7a3ca3dd      # KV 命名空间 ID
      R2_DATA_BUCKET: email                                  # 存放邮件附件的 R2 桶
      BACKUP_BUCKET: cloud-mail-backup                       # 备份文件上传到这个 R2 桶

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📥 Install wrangler
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 🔑 Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set. Cannot back up."
            exit 1
          fi

      - name: 🗂️ Prepare backup directory
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          echo "BACKUP_DIR=$RUNNER_TEMP/backup-$STAMP" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/backup-$STAMP"

      - name: 🗄️ Export D1 database
        working-directory: ./mail-worker
        run: |
          echo "Exporting D1 database '$D1_DATABASE_NAME'..."
          pnpm wrangler d1 export "$D1_DATABASE_NAME" --remote --output "$BACKUP_DIR/d1-$D1_DATABASE_NAME.sql"
          ls -lh "$BACKUP_DIR/d1-$D1_DATABASE_NAME.sql"

      - name: 🧹 Sanitize D1 dump and verify it restores
        run: |
          DUMP="$BACKUP_DIR/d1-$D1_DATABASE_NAME.sql"

          # wrangler d1 export 会把邮件正文里的原始字节直接吐出来，其中可能混入 NUL。
          # SQL 文本里出现 NUL 会打乱解析器的引号配对：直接 `sqlite3 db < dump` 只会导入
          # 极少数行、连表都建不全，但仅打印几行 parse error，integrity_check 仍回报 ok —— 失败是静默的。
          NULS=$(tr -dc '\000' < "$DUMP" | wc -c | tr -d ' ')
          echo "NUL bytes in dump: $NULS"
          if [ "$NULS" -gt 0 ]; then
            tr -d '\000' < "$DUMP" > "$DUMP.clean"
            mv "$DUMP.clean" "$DUMP"
            echo "::warning::Stripped $NULS NUL byte(s) from D1 dump; without this the dump does not restore."
          fi

          # 真的还原一次，确认这份 dump 可用（而不是只看文件大小）
          VERIFY_DB="$RUNNER_TEMP/verify-$STAMP.db"
          rm -f "$VERIFY_DB"
          if ! sqlite3 "$VERIFY_DB" < "$DUMP"; then
            echo "::error::D1 dump failed to restore into sqlite3."
            exit 1
          fi

          EMAILS=$(sqlite3 "$VERIFY_DB" "SELECT COUNT(*) FROM email;")
          USERS=$(sqlite3 "$VERIFY_DB" "SELECT COUNT(*) FROM user;")
          echo "Restore check: $EMAILS emails, $USERS users"
          echo "VERIFY_EMAILS=$EMAILS" >> $GITHUB_ENV
          echo "VERIFY_USERS=$USERS" >> $GITHUB_ENV

          if [ "$EMAILS" -lt 1 ] || [ "$USERS" -lt 1 ]; then
            echo "::error::D1 dump restored but is empty (emails=$EMAILS users=$USERS). Refusing to upload a useless backup."
            exit 1
          fi
          rm -f "$VERIFY_DB"

      - name: 🔑 Export KV namespace
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          mkdir -p "$BACKUP_DIR/kv/values"
          pnpm wrangler kv key list --namespace-id "$KV_NAMESPACE_ID" --remote > "$BACKUP_DIR/kv/keys.json"
          COUNT=$(jq length "$BACKUP_DIR/kv/keys.json")
          echo "KV keys to back up: $COUNT"
          i=0
          jq -r '.[].name' "$BACKUP_DIR/kv/keys.json" | while IFS= read -r key; do
            i=$((i+1))
            idx=$(printf '%06d' "$i")
            pnpm wrangler kv key get "$key" --namespace-id "$KV_NAMESPACE_ID" --remote > "$BACKUP_DIR/kv/values/$idx.val" || echo "⚠️ failed to get key: $key"
            printf '%s\t%s\n' "$idx" "$key" >> "$BACKUP_DIR/kv/index.tsv"
          done
          echo "✅ KV export complete."

      - name: 📎 Export R2 objects (attachments)
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          mkdir -p "$BACKUP_DIR/r2"
          KEYS_FILE="$RUNNER_TEMP/r2-keys.txt"
          : > "$KEYS_FILE"
          CURSOR=""
          while :; do
            URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_DATA_BUCKET}/objects?per_page=500"
            if [ -n "$CURSOR" ]; then URL="$URL&cursor=$CURSOR"; fi
            RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL")
            echo "$RESP" | jq -r '.result[]?.key' >> "$KEYS_FILE"
            TRUNC=$(echo "$RESP" | jq -r '.result_info.is_truncated // false')
            CURSOR=$(echo "$RESP" | jq -r '.result_info.cursor // empty')
            if [ "$TRUNC" != "true" ] || [ -z "$CURSOR" ]; then break; fi
          done
          echo "R2 objects to back up: $(wc -l < "$KEYS_FILE")"
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            mkdir -p "$BACKUP_DIR/r2/$(dirname "$key")"
            pnpm wrangler r2 object get "${R2_DATA_BUCKET}/${key}" --file "$BACKUP_DIR/r2/$key" --remote || echo "⚠️ failed to get object: $key"
          done < "$KEYS_FILE"
          echo "✅ R2 export complete."

      - name: 🔍 Verify backup completeness
        run: |
          # KV / R2 两步是 continue-on-error，失败时 job 仍会成功。
          # 这里补一道闸：真的产不出东西就让整个备份失败，别上传一个看起来正常的残缺包。
          KV_COUNT=$(find "$BACKUP_DIR/kv/values" -type f 2>/dev/null | wc -l | tr -d ' ')
          R2_COUNT=$(find "$BACKUP_DIR/r2" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "KV values: $KV_COUNT, R2 objects: $R2_COUNT"

          FAIL=0
          if [ "$KV_COUNT" -lt 1 ]; then
            echo "::error::KV export produced no files."
            FAIL=1
          fi
          if [ "$R2_COUNT" -lt 1 ]; then
            echo "::error::R2 attachment export produced no files."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

          # 把这次备份的实际内容记进包里，之后不用解压整包就能核对
          {
            echo "stamp=$STAMP"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "d1_emails=$VERIFY_EMAILS"
            echo "d1_users=$VERIFY_USERS"
            echo "kv_values=$KV_COUNT"
            echo "r2_objects=$R2_COUNT"
          } > "$BACKUP_DIR/manifest.txt"
          cat "$BACKUP_DIR/manifest.txt"

      - name: 🗜️ Create archive
        run: |
          tar -czf "$RUNNER_TEMP/cloud-mail-backup-$STAMP.tar.gz" -C "$BACKUP_DIR" .
          ls -lh "$RUNNER_TEMP/cloud-mail-backup-$STAMP.tar.gz"

      - name: ☁️ Upload backup to R2
        working-directory: ./mail-worker
        run: |
          pnpm wrangler r2 object put "${BACKUP_BUCKET}/${STAMP}/cloud-mail-backup-${STAMP}.tar.gz" \
            --file "$RUNNER_TEMP/cloud-mail-backup-$STAMP.tar.gz" --remote
          echo "✅ Backup uploaded to r2://${BACKUP_BUCKET}/${STAMP}/cloud-mail-backup-${STAMP}.tar.gz"

      - name: 📤 Upload backup as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-backup-${{ env.STAMP }}
          path: ${{ runner.temp }}/cloud-mail-backup-${{ env.STAMP }}.tar.gz
          retention-days: 14

      # GitHub 会在仓库连续 60 天没有活动时自动停用 schedule 触发的 workflow，
      # 停用后备份不会失败、而是根本不再运行，也就不会有任何告警。
      # 每月 1 号和 15 号推一个空提交，把这个计时器重置掉。
      - name: 🔄 Keepalive (prevent 60-day schedule auto-disable)
        if: success() && github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" != "01" ] && [ "$DAY" != "15" ]; then
            echo "Day $DAY — keepalive not due, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive so the backup schedule is not auto-disabled"
          # checkout@v4 默认是 detached HEAD，所以显式推回当前分支
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "✅ Keepalive commit pushed to ${GITHUB_REF_NAME}."

      # 备份失败时告警。仓库是 fork、issues 已关闭，所以这里走 Telegram；
      # 只有在设置了 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 两个 secret 时才会发送，
      # 没设置就静默跳过（此时仍可依赖 GitHub 内建的 workflow 失败邮件）。
      - name: 🚨 Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set — skipping notification."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT="🚨 cloud-mail 备份失败%0A仓库: $GITHUB_REPOSITORY%0A时间: $(date -u '+%Y-%m-%d %H:%M UTC')%0A详情: $RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" -d "text=${TEXT}" -d "disable_web_page_preview=true" > /dev/null
          echo "✅ Failure notification sent."
