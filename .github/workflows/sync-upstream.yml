name: 🔄 Sync upstream repository

on:
  schedule:
    - cron: "0 18 * * 0"   # 每周日 UTC 18:00（台北时间周一 02:00）检查上游更新
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: ⬇️ Check upstream and open issue
    runs-on: ubuntu-latest

    env:
      # 上游仓库，可在 Settings → Secrets and variables → Actions → Variables 里
      # 添加 UPSTREAM_REPO 变量来覆盖
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'maillab/cloud-mail' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Fetch upstream
        id: fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream

          # 检测上游默认分支
          UPSTREAM_HEAD=$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
          UPSTREAM_HEAD=${UPSTREAM_HEAD:-main}
          echo "Upstream default branch: $UPSTREAM_HEAD"
          echo "upstream_branch=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor "upstream/$UPSTREAM_HEAD" origin/main; then
            echo "✅ Already up to date with upstream. Nothing to do."
            echo "up_to_date=true" >> $GITHUB_OUTPUT
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
          fi

           # 上游会改 .github/workflows，GITHUB_TOKEN 没有 workflows 权限推不上去，
      # 所以这里只开 issue 提醒，由人手动（或让 Hark）合并升级。
      - name: 📬 Open reminder issue (if none exists)
        if: steps.fetch.outputs.up_to_date == 'false'
        run: |
          BR="${{ steps.fetch.outputs.upstream_branch }}"
          LATEST=$(git describe --tags --abbrev=0 "upstream/$BR" 2>/dev/null || echo "upstream/$BR")
          BEHIND=$(git rev-list --count "origin/main..upstream/$BR")
          MSG="上游 ${UPSTREAM_REPO} 有 ${BEHIND} 个新提交（最新标签 ${LATEST}），需要手动合并；合并时保留 mail-worker/wrangler.toml 绑定和 deploy-cloudflare.yml 的本地改动。"
          # 无论能否开 issue，都写进运行摘要并给出黄色警告，不让工作流报错
          echo "::warning title=上游有更新::${MSG}"
          echo "### 🔄 上游有更新" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline "origin/main..upstream/$BR" >> "$GITHUB_STEP_SUMMARY" || true

          # 仓库关闭 Issues 时 gh 会失败，这里吞掉错误
          EXISTING=$(gh issue list --state open --search "in:title 上游有更新" --json number --jq 'length' 2>/dev/null || echo "skip")
          if [ "$EXISTING" = "skip" ]; then
            echo "ℹ️ Issues 未开启，只保留警告和摘要。"
            exit 0
          fi
          if [ "$EXISTING" -gt 0 ]; then
            echo "✅ Reminder issue already open."
            exit 0
          fi
          gh issue create \
            --title "🔄 上游有更新：${UPSTREAM_REPO} ${LATEST}" \
            --body "${MSG}" || echo "ℹ️ 无法创建 issue，已略过。"
