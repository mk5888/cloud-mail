name: 🔄 Sync upstream repository

on:
  schedule:
    - cron: "0 18 * * 0"   # 每周日 UTC 18:00（台北时间周一 02:00）检查上游更新
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: ⬇️ Check upstream and open issue
    runs-on: ubuntu-latest

    env:
      # 上游仓库，可在 Settings → Secrets and variables → Actions → Variables 里
      # 添加 UPSTREAM_REPO 变量来覆盖
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'maillab/cloud-mail' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Fetch upstream
        id: fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream

          # 检测上游默认分支
          UPSTREAM_HEAD=$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
          UPSTREAM_HEAD=${UPSTREAM_HEAD:-main}
          echo "Upstream default branch: $UPSTREAM_HEAD"
          echo "upstream_branch=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor "upstream/$UPSTREAM_HEAD" origin/main; then
            echo "✅ Already up to date with upstream. Nothing to do."
            echo "up_to_date=true" >> $GITHUB_OUTPUT
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
          fi

           # 上游会改 .github/workflows，GITHUB_TOKEN 没有 workflows 权限推不上去，
      # 所以这里只开 issue 提醒，由人手动（或让 Hark）合并升级。
      - name: 📬 Open reminder issue (if none exists)
        if: steps.fetch.outputs.up_to_date == 'false'
        run: |
          LATEST=$(git describe --tags --abbrev=0 "upstream/${{ steps.fetch.outputs.upstream_branch }}" 2>/dev/null || echo "upstream/${{ steps.fetch.outputs.upstream_branch }}")
          EXISTING=$(gh issue list --state open --search "in:title 上游有更新" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "✅ Reminder issue already open."
            exit 0
          fi
          gh issue create \
            --title "🔄 上游有更新：${UPSTREAM_REPO} ${LATEST}" \
            --body "上游 [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}/releases) 有新提交，最新标签 ${LATEST}。合并时保留 mail-worker/wrangler.toml 绑定和 deploy-cloudflare.yml 的本地改动。"
